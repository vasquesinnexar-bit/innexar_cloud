name: innexar-usa

services:
  postgres:
    image: postgres:15-alpine
    container_name: innexar-usa-workspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-innexar_workspace}
      POSTGRES_USER: ${POSTGRES_USER:-workspace_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - innexar-usa-workspace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workspace_user} -d ${POSTGRES_DB:-innexar_workspace}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: innexar-usa-workspace-minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - innexar-usa-workspace

  backend:
    build: .
    image: innexar-usa-workspace-backend
    container_name: innexar-usa-workspace-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-workspace_user}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-innexar_workspace}
      SECRET_KEY_STAFF: ${SECRET_KEY_STAFF:-change-me-staff}
      SECRET_KEY_CUSTOMER: ${SECRET_KEY_CUSTOMER:-change-me-customer}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://innexar.app,https://panel.innexar.app,https://workspace.innexar.app,https://innexar.com.br,https://www.innexar.com.br,https://portal.innexar.com.br,https://app.innexar.com.br,http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-https://innexar.app}
      PORTAL_URL: ${PORTAL_URL:-https://panel.innexar.app}
      SEED_TOKEN: ${SEED_TOKEN:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-${MERCADOPAGO_ACCESS_TOKEN:-}}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-${MP_ACCESS_TOKEN:-}}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-1}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-no-reply@innexar.app}
      LEADS_NOTIFICATION_EMAIL: ${LEADS_NOTIFICATION_EMAIL:-vasques.innexar@gmail.com}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-vasques.innexar@gmail.com}
      OPS_ALERT_EMAIL_ALIASES: ${OPS_ALERT_EMAIL_ALIASES:-}
      OPS_TELEGRAM_BOT_TOKEN: ${OPS_TELEGRAM_BOT_TOKEN:-}
      OPS_TELEGRAM_CHAT_ID: ${OPS_TELEGRAM_CHAT_ID:-}
      OPS_COPY_ALL_EMAIL_NOTIFICATIONS: ${OPS_COPY_ALL_EMAIL_NOTIFICATIONS:-true}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://innexar-usa-workspace-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_PROJECTS: ${MINIO_BUCKET_PROJECTS:-project-files}
      # Innexar Mail (Fase 2): CLI do mailserver via `docker exec` (mesmo padrão do mail-admin)
      MAIL_CONTAINER: ${MAIL_CONTAINER:-innexar-mailserver}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /usr/bin/docker:/usr/bin/docker:ro
      # Somente leitura: permite ao overview de hosting medir disco de backups
      - /srv/innexar/backups:/srv/innexar/backups:ro
    # API pública via Traefik (api3.innexar.app); bind só em loopback para debug local
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      - innexar-usa-workspace
      # Rede Traefik: só use se o backend rodar no mesmo host do site (innexar-websitebr). Senão remova esta rede e os labels abaixo.
      - fixelo_fixelo-network
    labels:
      # Traefik USA: api3.innexar.app (WaaS EUA)
      - "traefik.enable=true"
      - "traefik.http.middlewares.usa-api-compress.compress=true"
      - "traefik.http.middlewares.usa-api-ratelimit.ratelimit.average=90"
      - "traefik.http.middlewares.usa-api-ratelimit.ratelimit.burst=60"
      - "traefik.http.middlewares.usa-api-ratelimit.ratelimit.period=1s"
      - "traefik.http.middlewares.usa-api-ratelimit.ratelimit.sourcecriterion.requestheadername=CF-Connecting-IP"
      - "traefik.http.middlewares.usa-api-inflight.inflightreq.amount=80"
      - "traefik.http.routers.usa-api.rule=Host(`api3.innexar.app`)"
      - "traefik.http.routers.usa-api.entrypoints=websecure"
      - "traefik.http.routers.usa-api.tls.certresolver=cloudflare"
      - "traefik.http.routers.usa-api.middlewares=usa-api-ratelimit,usa-api-inflight,usa-api-compress"
      - "traefik.http.routers.usa-api.service=usa-api-service"
      - "traefik.http.routers.usa-api-br.rule=Host(`api.innexar.com.br`)"
      - "traefik.http.routers.usa-api-br.entrypoints=websecure"
      - "traefik.http.routers.usa-api-br.tls.certresolver=cloudflare"
      - "traefik.http.routers.usa-api-br.middlewares=usa-api-ratelimit,usa-api-inflight,usa-api-compress"
      - "traefik.http.routers.usa-api-br.service=usa-api-service"
      - "traefik.http.services.usa-api-service.loadbalancer.server.port=8000"
      - "traefik.http.services.usa-api-service.loadbalancer.passHostHeader=true"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  innexar-usa-workspace:
    name: innexar-usa-workspace
    driver: bridge
  fixelo_fixelo-network:
    external: true

volumes:
  postgres_data:
    external: true
    name: innexar-usa_postgres_data
  minio_data:
