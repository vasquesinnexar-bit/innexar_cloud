name: innexar-usa

services:
  usa-portal-maintenance:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./maintenance.html:/usr/share/nginx/html/index.html:ro
    networks:
      - fixelo_fixelo-network

  innexar-portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        - NEXT_PUBLIC_USE_WORKSPACE_API=${NEXT_PUBLIC_USE_WORKSPACE_API:-true}
        - NEXT_PUBLIC_WORKSPACE_API_URL=${NEXT_PUBLIC_WORKSPACE_API_URL:-https://api3.innexar.app}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://innexar.app}
        - NEXT_PUBLIC_MP_PUBLIC_KEY=${NEXT_PUBLIC_MP_PUBLIC_KEY}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    container_name: innexar-usa-portal
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_USE_WORKSPACE_API=${NEXT_PUBLIC_USE_WORKSPACE_API:-true}
      - NEXT_PUBLIC_WORKSPACE_API_URL=${NEXT_PUBLIC_WORKSPACE_API_URL:-https://api3.innexar.app}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://innexar.app}
    env_file:
      - .env
    networks:
      - fixelo_fixelo-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.usa-portal-compress.compress=true"
      - "traefik.http.middlewares.usa-portal-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.usa-portal-ratelimit.ratelimit.burst=70"
      - "traefik.http.middlewares.usa-portal-ratelimit.ratelimit.period=1s"
      - "traefik.http.middlewares.usa-portal-ratelimit.ratelimit.sourcecriterion.requestheadername=CF-Connecting-IP"
      - "traefik.http.middlewares.usa-portal-inflight.inflightreq.amount=100"
      - "traefik.http.middlewares.usa-portal-maintenance.errors.status=500-599"
      - "traefik.http.middlewares.usa-portal-maintenance.errors.service=usa-portal-maintenance-service"
      - "traefik.http.middlewares.usa-portal-maintenance.errors.query=/"
      - "traefik.http.routers.usa-portal.rule=Host(`panel.innexar.app`) || Host(`portal.innexar.com.br`)"
      - "traefik.http.routers.usa-portal.entrypoints=websecure"
      - "traefik.http.routers.usa-portal.tls.certresolver=cloudflare"
      - "traefik.http.routers.usa-portal.middlewares=usa-portal-ratelimit,usa-portal-inflight,usa-portal-compress,usa-portal-maintenance"
      - "traefik.http.routers.usa-portal.service=usa-portal-service"
      - "traefik.http.services.usa-portal-service.loadbalancer.server.port=3000"
      - "traefik.http.services.usa-portal-service.loadbalancer.passHostHeader=true"
      - "traefik.http.services.usa-portal-maintenance-service.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  fixelo_fixelo-network:
    external: true
